<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>RoomCraft Clipper</title>
<style>
  body { font: 13px/1.4 "Segoe UI", Arial, sans-serif; width: 360px; margin: 0; padding: 12px; color: #0f172a; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #1f63c0; }
  h2 { font-size: 13px; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
  label { display: block; font-size: 11px; color: #64748b; margin: 6px 0 2px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 5px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 6px; } .row > div { flex: 1; }
  button { padding: 6px 10px; border-radius: 6px; border: 1px solid #1f63c0; background: #1f63c0; color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #fff; color: #1f63c0; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 6px; padding: 6px 8px; border-radius: 6px; font-size: 12px; white-space: pre-line; }
  .ok { background: #ecfdf5; color: #065f46; } .err { background: #fef2f2; color: #991b1b; } .info { background: #f1f5f9; color: #334155; }
  #preview img { max-width: 100%; max-height: 90px; object-fit: contain; display: block; margin: 4px auto; }
  .ltr { direction: ltr; text-align: left; }
  progress { width: 100%; margin-top: 6px; }
</style>
</head>
<body>
  <h1>🏠 RoomCraft Clipper</h1>
  <label>כתובת השרת המקומי</label>
  <input id="server" class="ltr" value="http://127.0.0.1:8000">

  <h2>1. הוספת המוצר שבדף הנוכחי</h2>
  <button id="scan">סרוק את הדף</button>
  <div id="status"></div>
  <div id="preview" hidden>
    <img id="img" alt="">
    <label>שם</label><input id="title">
    <div class="row">
      <div><label>חנות</label><input id="store"></div>
      <div><label>קטגוריה</label><select id="category"></select></div>
    </div>
    <div class="row">
      <div><label>רוחב (ס"מ)</label><input id="w" type="number" class="ltr"></div>
      <div><label>עומק (ס"מ)</label><input id="d" type="number" class="ltr"></div>
      <div><label>גובה (ס"מ)</label><input id="h" type="number" class="ltr"></div>
    </div>
    <div class="row">
      <div><label>מחיר (₪)</label><input id="price" type="number" class="ltr"></div>
      <div><label>קישור תמונה</label><input id="image" class="ltr"></div>
    </div>
    <p></p><button id="save">שמור בקטלוג</button>
  </div>

  <h2>2. ייבוא מרוכז (קישורים רבים)</h2>
  <label>דפוס קישור לאיסוף מהדף (regex, לא חובה)</label>
  <input id="pattern" class="ltr" placeholder="/product|/p/|-p-|\d{5,}">
  <div class="row" style="margin:6px 0"><button id="collect" class="secondary">אסוף קישורים מהדף</button></div>
  <label>קישורים (אחד בכל שורה)</label>
  <textarea id="urls" rows="4" class="ltr"></textarea>
  <div class="row" style="margin-top:6px"><button id="batch">ייבא הכל</button><button id="stop" class="secondary">עצור</button></div>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="batchStatus"></div>
  <script src="popup.js"></script>
</body>
</html>
